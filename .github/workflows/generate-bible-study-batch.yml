name: Generate curated Bible study batch

on:
  workflow_dispatch:
    inputs:
      book_slug:
        description: "Slug do livro em bible-books.ts"
        required: true
        default: "numeros"
        type: string
      start_chapter:
        description: "Capítulo inicial a examinar"
        required: true
        default: "21"
        type: string
      batch_size:
        description: "Quantidade de capítulos a examinar (1 a 7)"
        required: true
        default: "3"
        type: string
      model:
        description: "Modelo Gemini API"
        required: true
        default: "gemini-3.8-flash"
        type: string
      auto_continue:
        description: "Continuar automaticamente até o último capítulo do livro"
        required: true
        default: false
        type: boolean
      target_branch:
        description: "Branch de trabalho já criada"
        required: true
        default: "codex/universal-bible-study-automation-rebased"
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: bible-study-batch-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout branch de trabalho
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
      - name: Diagnosticar versão do código
        run: |
          set -euo pipefail
          echo "Branch: $(git branch --show-current)"
          echo "Commit: $(git rev-parse HEAD)"
          git log -1 --oneline
          echo "Final do gerador:"
          nl -ba scripts/generate-bible-study-batch.py | tail -n 12
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar somente capítulos ausentes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ inputs.model }}
          BOOK_SLUG: ${{ inputs.book_slug }}
          START_CHAPTER: ${{ inputs.start_chapter }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          set -euo pipefail
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::Cadastre GEMINI_API_KEY em Settings > Secrets and variables > Actions."; exit 1; fi
          python -m py_compile scripts/generate-bible-study-batch.py
          python scripts/generate-bible-study-batch.py
      - name: Validar alterações
        run: |
          set -euo pipefail
          git diff --check
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run lint -- --rule 'prettier/prettier: off'
          npm run build
          npm test
      - name: Commit e push do lote
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/content
          if git diff --cached --quiet; then
            echo "Nenhum estudo novo; nada para enviar."
            exit 0
          fi
          git commit -m "content(bible): add ${{ inputs.book_slug }} study batch"
          git push origin "${{ inputs.target_branch }}"
      - name: Abrir ou atualizar PR do lote
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          BOOK_SLUG: ${{ inputs.book_slug }}
          START_CHAPTER: ${{ inputs.start_chapter }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          set -euo pipefail
          TITLE="Estudos bíblicos: ${BOOK_SLUG} — capítulos ${START_CHAPTER}+"
          BODY=$(printf '## Lote de estudos bíblicos\n\n- Livro: %s\n- Faixa examinada: %s–%s\n- Capítulos existentes preservados; somente ausentes são criados.\n- Validações: TypeScript, ESLint, build e testes.\n- Revisão teológica/editorial humana obrigatória.\n\n**Não mesclar automaticamente.**' "$BOOK_SLUG" "$START_CHAPTER" "$((START_CHAPTER + BATCH_SIZE - 1))")
          EXISTING=$(gh pr list --head "$TARGET_BRANCH" --base main --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base main --head "$TARGET_BRANCH" --title "$TITLE" --body "$BODY"
          fi
      - name: Agendar próximo lote automaticamente
        if: ${{ inputs.auto_continue }}
        env:
          GH_TOKEN: ${{ github.token }}
          BOOK_SLUG: ${{ inputs.book_slug }}
          START_CHAPTER: ${{ inputs.start_chapter }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          MODEL: ${{ inputs.model }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          import re
          from pathlib import Path

          source = Path("src/lib/content/bible-books.ts").read_text(encoding="utf-8")
          books = []
          for item in re.findall(r"\{([^{}]*\bslug\s*:[^{}]*)\}", source, re.S):
              def field(pattern):
                  match = re.search(pattern, item)
                  return match.group(1) if match else None
              slug = field(r'\bslug\s*:\s*"([^"]+)"')
              chapters = field(r"\bchapters\s*:\s*(\d+)")
              order = field(r"\border\s*:\s*(\d+)")
              if slug and chapters and order:
                  books.append({"slug": slug, "chapters": int(chapters), "order": int(order)})
          books.sort(key=lambda book: book["order"])
          if len(books) != 66:
              raise SystemExit(f"Índice bíblico inválido: esperados 66 livros, encontrados {len(books)}.")

          current_index = next((i for i, book in enumerate(books) if book["slug"] == os.environ["BOOK_SLUG"]), None)
          if current_index is None:
              raise SystemExit(f"Livro atual não encontrado: {os.environ['BOOK_SLUG']}.")
          start = int(os.environ["START_CHAPTER"])
          batch = int(os.environ["BATCH_SIZE"])
          current = books[current_index]
          if start < 1 or start > current["chapters"] or not 1 <= batch <= 7:
              raise SystemExit("Faixa atual inválida; continuação interrompida.")

          actual_end = min(start + batch - 1, current["chapters"])
          if actual_end < current["chapters"]:
              next_book = current
              next_start = actual_end + 1
          elif current_index + 1 < len(books):
              next_book = books[current_index + 1]
              next_start = 1
          else:
              print("BIBLE_FINISHED=true")
              print(f"NEXT_BOOK_SLUG={current['slug']}")
              print("NEXT_START_CHAPTER=1")
              print("NEXT_BATCH_SIZE=1")
              print(f"echo='Bíblia concluída: {current['slug']} {current['chapters']}/ {current['chapters']}.'")
              raise SystemExit(0)

          next_batch = min(batch, next_book["chapters"] - next_start + 1)
          print("BIBLE_FINISHED=false")
          print(f"NEXT_BOOK_SLUG={next_book['slug']}")
          print(f"NEXT_START_CHAPTER={next_start}")
          print(f"NEXT_BATCH_SIZE={next_batch}")
          print(f"NEXT_BOOK_CHAPTERS={next_book['chapters']}")
          print(f"NEXT_BOOK_ORDER={next_book['order']}")
          PY

          if [ "$BIBLE_FINISHED" = "true" ]; then
            echo "Todos os 66 livros e 1.189 capítulos foram percorridos."
            exit 0
          fi

          echo "Próximo lote: $NEXT_BOOK_SLUG capítulos $NEXT_START_CHAPTER–$((NEXT_START_CHAPTER + NEXT_BATCH_SIZE - 1)) (total do livro: $NEXT_BOOK_CHAPTERS)."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/generate-bible-study-batch.yml/dispatches" \
            -f ref=main \
            -f "inputs[book_slug]=$NEXT_BOOK_SLUG" \
            -f "inputs[start_chapter]=$NEXT_START_CHAPTER" \
            -f "inputs[batch_size]=$NEXT_BATCH_SIZE" \
            -f "inputs[model]=$MODEL" \
            -f "inputs[target_branch]=$TARGET_BRANCH" \
            -f "inputs[auto_continue]=true"
