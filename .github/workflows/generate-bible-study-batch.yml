name: Generate curated Bible study batch

on:
  workflow_dispatch:
    inputs:
      start_chapter:
        description: "Primeiro capítulo de Gênesis a gerar"
        required: true
        default: "24"
        type: string
      batch_size:
        description: "Quantidade de capítulos consecutivos (1 a 7)"
        required: true
        default: "7"
        type: string
      model:
        description: "GitHub Models model id"
        required: true
        default: "openai/gpt-4.1"
        type: string
      target_branch:
        description: "Branch de trabalho já criada"
        required: true
        default: "codex/genesis-24-30"
        type: string

permissions:
  contents: write
  models: read
  pull-requests: write

concurrency:
  group: genesis-study-batch-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout branch de trabalho
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar estudos em sequência
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ inputs.model }}
          START_CHAPTER: ${{ inputs.start_chapter }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: python scripts/generate-bible-study-batch.py

      - name: Validar alterações
        run: |
          set -euo pipefail
          git diff --check
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run lint -- --rule 'prettier/prettier: off'
          npm run build
          npm test

      - name: Commit e push do lote
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/content
          if git diff --cached --quiet; then
            echo "Nenhum estudo novo foi gerado."
            exit 1
          fi
          git commit -m "content(bible): add Genesis ${{ inputs.start_chapter }} batch"
          git push origin "${{ inputs.target_branch }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Abrir ou atualizar PR do lote
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          START_CHAPTER: ${{ inputs.start_chapter }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          set -euo pipefail
          END_CHAPTER=$((START_CHAPTER + BATCH_SIZE - 1))
          TITLE="Estudos bíblicos profundos: Gênesis ${START_CHAPTER}–${END_CHAPTER}"
          BODY=$(printf '## Lote de estudos\n\n- Capítulos: Gênesis %s–%s\n- Gerados individualmente em sequência, sem sobrescrever estudos existentes.\n- Validações: TypeScript, ESLint, build e testes.\n- Revisão teológica/editorial humana necessária antes do merge.\n\n**Esta PR não deve ser mesclada automaticamente.**' "$START_CHAPTER" "$END_CHAPTER")
          EXISTING=$(gh pr list --head "$TARGET_BRANCH" --base main --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
            echo "PR existente atualizada: #$EXISTING"
          else
            gh pr create --base main --head "$TARGET_BRANCH" --title "$TITLE" --body "$BODY"
          fi
