name: Generate curated Bible study batch

on:
  workflow_dispatch:
    inputs:
      book_slug:
        description: "Slug do livro em bible-books.ts"
        required: true
        default: "numeros"
        type: string
      start_chapter:
        description: "Capítulo inicial a examinar"
        required: true
        default: "28"
        type: string
      batch_size:
        description: "Quantidade de capítulos por lote (1 a 7)"
        required: true
        default: "7"
        type: string
      model:
        description: "Modelo Gemini API"
        required: true
        default: "gemini-3.8-flash"
        type: string
      auto_continue:
        description: "Continuar após o merge validado de cada PR"
        required: true
        default: true
        type: boolean
      target_branch:
        description: "Branch persistente de checkpoints"
        required: true
        default: "codex/bible-study-batches"
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

concurrency:
  group: bible-study-batch-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar branch persistente de checkpoints
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
            git merge --no-edit origin/main
          else
            git checkout -b "$TARGET_BRANCH" origin/main
            git push -u origin "$TARGET_BRANCH"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar faixa e calcular limite do lote
        id: range
        env:
          BOOK_SLUG: ${{ inputs.book_slug }}
          START_CHAPTER: ${{ inputs.start_chapter }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          set -euo pipefail
          node scripts/next-bible-study-batch.mjs >> "$GITHUB_OUTPUT"

      - name: Gerar capítulo por capítulo e salvar checkpoint sem sobrescrever
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ inputs.model }}
          BOOK_SLUG: ${{ inputs.book_slug }}
          START_CHAPTER: ${{ inputs.start_chapter }}
          BATCH_END_CHAPTER: ${{ steps.range.outputs.BATCH_END_CHAPTER }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Cadastre GEMINI_API_KEY em Settings > Secrets and variables > Actions."
            exit 1
          fi
          python -m py_compile scripts/generate-bible-study-batch.py

          for chapter in $(seq "$START_CHAPTER" "$BATCH_END_CHAPTER"); do
            echo "::group::${BOOK_SLUG} capítulo ${chapter}"
            START_CHAPTER="$chapter" BATCH_SIZE=1 python scripts/generate-bible-study-batch.py
            git add src/lib/content
            if git diff --cached --quiet; then
              echo "Capítulo $chapter já existia; conteúdo preservado sem sobrescrita."
            else
              git commit -m "content(bible): checkpoint ${BOOK_SLUG} chapter ${chapter}"
              git push origin "$TARGET_BRANCH"
              echo "Checkpoint do capítulo $chapter enviado ao GitHub."
            fi
            echo "::endgroup::"
          done

      - name: Validar o lote completo
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --check origin/main HEAD
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run lint -- --rule 'prettier/prettier: off'
          npm run build
          npm test

      - name: Detectar conteúdo pendente de integração
        id: changes
        run: |
          set -euo pipefail
          git fetch origin main
          if git diff --quiet origin/main HEAD -- src/lib/content; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum capítulo novo ou registro pendente; arquivos existentes preservados."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Há conteúdo validado aguardando PR e merge."
          fi

      - name: Abrir PR após validação geral
        id: pr
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          BOOK_SLUG: ${{ inputs.book_slug }}
          START_CHAPTER: ${{ inputs.start_chapter }}
          BATCH_END_CHAPTER: ${{ steps.range.outputs.BATCH_END_CHAPTER }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          MODEL: ${{ inputs.model }}
          AUTO_CONTINUE: ${{ inputs.auto_continue }}
        run: |
          set -euo pipefail
          EXISTING="$(gh pr list --head "$TARGET_BRANCH" --base main --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            EXISTING_BODY="$(gh pr view "$EXISTING" --json body --jq '.body')"
            if ! grep -Fq -- "- Livro: $BOOK_SLUG" <<< "$EXISTING_BODY" ||
               ! grep -Fq -- "- Início: $START_CHAPTER" <<< "$EXISTING_BODY"; then
              echo "::error::Já existe a PR #$EXISTING de outro lote nesta branch. Aguarde o merge antes de iniciar outro lote."
              exit 1
            fi
            PR_NUMBER="$EXISTING"
          else
            PR_NUMBER=""
          fi

          MARKER=""
          if [ "$AUTO_CONTINUE" = "true" ]; then
            MARKER="$(cat <<EOF
          <!-- BIBLE_STUDY_AUTO_CONTINUE
          book_slug=$BOOK_SLUG
          start_chapter=$START_CHAPTER
          batch_size=$BATCH_SIZE
          model=$MODEL
          target_branch=$TARGET_BRANCH
          -->
          EOF
          )"
          fi

          BODY="$(cat <<EOF
          ## Lote de estudos bíblicos

          - Livro: $BOOK_SLUG
          - Início: $START_CHAPTER
          - Fim examinado: $BATCH_END_CHAPTER
          - Geração executada capítulo por capítulo.
          - Cada capítulo novo passou pela validação individual antes de ser gravado.
          - Checkpoint enviado ao GitHub após cada capítulo validado.
          - Arquivos existentes foram preservados; nenhum estudo foi sobrescrito.
          - Validação geral do lote: TypeScript, ESLint, build e testes.
          - Revisão bíblica/editorial humana antes do merge.

          **Faça o merge somente depois que todas as verificações da PR estiverem verdes.**
          A próxima faixa só será iniciada depois do merge e de uma nova confirmação de que os checks passaram.

          $MARKER
          EOF
          )"

          TITLE="Estudos bíblicos: $BOOK_SLUG — capítulos $START_CHAPTER–$BATCH_END_CHAPTER"
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base main --head "$TARGET_BRANCH" --title "$TITLE" --body "$BODY"
            PR_NUMBER="$(gh pr list --head "$TARGET_BRANCH" --base main --json number --jq '.[0].number // empty')"
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "::error::Não foi possível confirmar o número da PR criada."
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "PR #$PR_NUMBER aberta/atualizada. Aguardando validações."

      - name: Aguardar todos os checks da PR
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')"
          for attempt in $(seq 1 120); do
            checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100")"
            latest="$(jq '[.check_runs | group_by(.name)[] | max_by(.id)]' <<< "$checks")"
            count="$(jq 'length' <<< "$latest")"
            pending="$(jq '[.[] | select(.status != "completed")] | length' <<< "$latest")"
            failed="$(jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length' <<< "$latest")"

            if [ "$count" -gt 0 ] && [ "$pending" -eq 0 ]; then
              if [ "$failed" -gt 0 ]; then
                jq -r '.[] | select(.status != "completed" or .conclusion != "success") | "(.name): (.status)/(.conclusion)"' <<< "$latest"
                echo "::error::A PR não passou em todas as verificações. Nenhuma continuação será agendada."
                exit 1
              fi
              echo "Todos os $count checks do commit $HEAD_SHA foram concluídos com sucesso."
              exit 0
            fi
            sleep 15
          done

          echo "::error::Tempo esgotado aguardando os checks da PR. Não houve merge nem continuação."
          exit 1

      - name: Continuar quando todos os capítulos já estavam preservados
        if: ${{ inputs.auto_continue && steps.changes.outputs.changed != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BOOK_SLUG: ${{ inputs.book_slug }}
          START_CHAPTER: ${{ inputs.start_chapter }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          MODEL: ${{ inputs.model }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          node scripts/next-bible-study-batch.mjs > /tmp/next-batch.env
          source /tmp/next-batch.env

          if [ "$BIBLE_FINISHED" = "true" ]; then
            echo "Todos os 66 livros e 1.189 capítulos foram percorridos."
            exit 0
          fi

          echo "Faixa preservada. Próximo lote: $NEXT_BOOK_SLUG capítulos $NEXT_START_CHAPTER–$((NEXT_START_CHAPTER + NEXT_BATCH_SIZE - 1))."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/generate-bible-study-batch.yml/dispatches" \
            -f ref=main \
            -f "inputs[book_slug]=$NEXT_BOOK_SLUG" \
            -f "inputs[start_chapter]=$NEXT_START_CHAPTER" \
            -f "inputs[batch_size]=$NEXT_BATCH_SIZE" \
            -f "inputs[model]=$MODEL" \
            -f "inputs[target_branch]=$TARGET_BRANCH" \
            -f "inputs[auto_continue]=true"
