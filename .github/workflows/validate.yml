name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - release/prelaunch-hardening-2026-11
      - fix/prelaunch-hardening-2026-11

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    name: Regenerate npm lockfile
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/prelaunch-hardening-2026-11'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Resolve the manifest/lockfile mismatch without executing dependency scripts.
      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lockfile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate npm lockfile"
          gh auth setup-git
          git push origin "HEAD:${GITHUB_REF_NAME}"

  validate:
    name: Lint and production build
    needs: refresh-lockfile
    if: always() && (needs.refresh-lockfile.result == 'success' || needs.refresh-lockfile.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout latest branch state
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund

      # Keep all semantic ESLint rules enabled. The legacy repository still has
      # Prettier-only violations; changed files are checked independently below.
      - name: Run ESLint
        run: npm run lint -- --rule 'prettier/prettier: off'

      - name: Check formatting of changed validation files
        run: npx prettier --check src/routes/api/chat.ts .github/workflows/validate.yml

      - name: Build production app
        run: npm run build
