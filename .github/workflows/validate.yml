name: Validate

"on":
  pull_request:
    branches: [main]
  push:
    branches:
      - release/prelaunch-hardening-2026-11

permissions:
  contents: write

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # npm ci fails if package.json and the committed lockfile are inconsistent.
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund

      # Preserve semantic ESLint rules; only the repository-wide legacy Prettier
      # rule is excluded. All files touched by this PR are checked below.
      - name: Run ESLint
        run: |
          npm run lint -- --rule 'prettier/prettier: off'

      - name: Check formatting of hardened files
        run: npx prettier --check src/routes/api/chat.ts src/routes/api/escola/professor-ia.ts src/routes/api/escola/professor-tts.ts src/lib/request-body.server.ts .github/workflows/validate.yml

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build production app
        run: npm run build
