name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - release/prelaunch-hardening-2026-11
      - fix/prelaunch-hardening-2026-11

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    name: Regenerate npm lockfile
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/prelaunch-hardening-2026-11'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.lock.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Generate the lockfile without running third-party install scripts.
      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Detect lockfile changes
        id: lock
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The token is exposed only in this final step, after dependency resolution.
      - name: Commit regenerated lockfile
        if: steps.lock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate npm lockfile"
          gh auth setup-git
          git push origin "HEAD:${GITHUB_REF_NAME}"

  validate:
    name: Lint and production build
    needs: refresh-lockfile
    if: always() && (needs.refresh-lockfile.result == 'success' || needs.refresh-lockfile.result == 'skipped') && needs.refresh-lockfile.outputs.changed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund

      # The legacy repository has existing Prettier-only violations.
      # All other ESLint rules remain enabled; changed files are checked by Prettier below.
      - name: Run ESLint
        run: npm run lint -- --rule 'prettier/prettier: off'

      - name: Check formatting of changed validation files
        run: npx prettier --check src/routes/api/chat.ts .github/workflows/validate.yml

      - name: Build production app
        run: npm run build
