name: Validate

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Install, test and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint -- --rule 'prettier/prettier: off'

      - name: Check formatting
        run: npx prettier --check .github/workflows/validate.yml package.json src/lib/ai-rate-limit.server.ts src/lib/request-body.server.ts src/routes/api/chat.ts src/routes/api/escola/professor-ia.ts src/routes/api/escola/professor-tts.ts tests/ai-rate-limit.test.mjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run automated tests
        run: npm test

      - name: Build production app
        run: npm run build
