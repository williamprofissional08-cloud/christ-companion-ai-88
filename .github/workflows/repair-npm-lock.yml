name: Repair npm lockfile and validate

on:
  push:
    branches:
      - 'fix/supabase-project-gemini-404'
      - 'content/numeros-15-exposicao-versiculo-por-versiculo'

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.9

      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Verify clean installation
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint -- --rule 'prettier/prettier: off'

      - name: Check formatting
        run: npx prettier --check .github/workflows/validate.yml package.json src/lib/ai-rate-limit.server.ts src/lib/request-body.server.ts src/routes/api/chat.ts src/routes/api/escola/professor-ia.ts src/routes/api/escola/professor-tts.ts tests/ai-rate-limit.test.mjs

      - name: Build production app
        run: npm run build

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run automated tests
        run: npm test

      - name: Commit regenerated lockfile and remove temporary workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git rm .github/workflows/repair-npm-lock.yml
          if git diff --cached --quiet; then
            echo 'No lockfile changes to commit.'
          else
            git commit -m 'fix: synchronize npm lockfile and validate project'
            git push origin HEAD
          fi