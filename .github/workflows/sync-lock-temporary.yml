name: Temporary lockfile repair
on:
  push:
    branches:
      - fix/npm-lock-sync
permissions:
  contents: write
concurrency:
  group: temporary-lockfile-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit corrected lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: synchronize npm lockfile"
          git push origin HEAD:fix/npm-lock-sync
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/sync-lock-temporary.yml
          git commit -m "chore: remove temporary lockfile repair workflow"
          git push origin HEAD:fix/npm-lock-sync
