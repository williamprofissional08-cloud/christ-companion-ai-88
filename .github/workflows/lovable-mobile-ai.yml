name: Lovable Mobile AI
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Pedido de alteraÃ§Ã£o
        required: true
        type: string
      model:
        description: Modelo GitHub Models
        required: false
        default: openai/gpt-4.1
        type: string
permissions:
  contents: write
  models: read
jobs:
  modify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply AI change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_PROMPT: ${{ inputs.prompt }}
          MODEL: ${{ inputs.model }}
        run: |
          python - <<'PY'
          import os,json,pathlib,urllib.request,urllib.error,re,subprocess
          root=pathlib.Path('.')
          prompt=os.environ['USER_PROMPT']; model=os.environ.get('MODEL') or 'openai/gpt-4.1'; token=os.environ['GH_TOKEN']
          exts={'.ts','.tsx','.js','.jsx','.mjs','.cjs','.json','.css','.scss','.sass','.less','.html','.md','.mdx','.vue','.svelte','.astro','.py','.java','.kt','.go','.rs','.rb','.php','.sql','.graphql','.yml','.yaml','.toml','.xml','.txt','.sh'}
          names={'Dockerfile','Makefile','README','LICENSE'}; skip_dirs={'.git','node_modules','dist','build','.next','.vercel','.turbo','coverage'}
          files=[]
          for p in root.rglob('*'):
            if not p.is_file() or any(part in skip_dirs for part in p.parts): continue
            if p.name.startswith('.env') and p.name!='.env.example': continue
            if p.name not in names and p.suffix.lower() not in exts: continue
            try: data=p.read_text(encoding='utf-8')
            except Exception: continue
            if len(data)>50000: continue
            files.append((p.as_posix(),data))
          terms=set(re.findall(r'[A-Za-zÃ-Ã¿0-9_/-]{3,}',prompt.lower())); scored=[]
          for path,data in files:
            low=(path+' '+data[:12000]).lower(); score=sum(2 for t in terms if t in low)
            if pathlib.Path(path).name.lower() in {'package.json','vite.config.ts','vite.config.js','src/app.tsx','src/app.jsx','src/main.tsx','src/main.jsx'}: score+=3
            scored.append((score,path,data))
          scored.sort(key=lambda x:(-x[0],x[1])); selected=scored[:24]
          while selected and sum(len(x[2]) for x in selected)>110000: selected.pop()
          context='\n\n'.join('===== FILE: '+p+' =====\n'+d for _,p,d in selected)
          system='''You are a senior software engineer modifying an existing GitHub repository. Preserve existing functionality. Make only the changes required by the user's request. Never expose or create secrets. Never modify .github/workflows, .env files, lockfiles, or generated/binary files unless explicitly requested. Return ONLY valid JSON: {"summary":"...","files":[{"path":"...","content":"FULL FILE CONTENT"}]}. Each returned file must be complete, not a diff or snippet. Only return files actually provided in context. Keep imports and project conventions consistent.'''
          user='User request:\n'+prompt+'\n\nRepository files selected for context ('+str(len(selected))+'):\n'+context
          payload=json.dumps({'model':model,'messages':[{'role':'system','content':system},{'role':'user','content':user}],'temperature':0.1}).encode()
          req=urllib.request.Request('https://models.github.ai/inference/chat/completions',data=payload,headers={'Content-Type':'application/json','Accept':'application/json','Authorization':'Bearer '+token})
          try:
            with urllib.request.urlopen(req,timeout=180) as r: result=json.loads(r.read().decode())
          except urllib.error.HTTPError as e: raise SystemExit('GitHub Models HTTP '+str(e.code)+': '+e.read().decode(errors='replace')[:1000])
          except Exception as e: raise SystemExit('GitHub Models connection error: '+str(e))
          raw=result.get('choices',[{}])[0].get('message',{}).get('content','').strip(); raw=re.sub(r'^```(?:json)?\s*','',raw); raw=re.sub(r'\s*```$','',raw)
          try: proposal=json.loads(raw)
          except Exception: raise SystemExit('Model did not return valid JSON: '+raw[:1500])
          changed=proposal.get('files') or []; allowed={p for _,p,_ in selected}
          if not changed: raise SystemExit('The AI returned no files to change.')
          for f in changed:
            path=f.get('path'); content=f.get('content')
            if not path or not isinstance(content,str): raise SystemExit('Invalid file returned by model.')
            if path not in allowed: raise SystemExit('Model attempted to modify a file not in context: '+path)
            if path.startswith('.github/workflows/') or '.env' in pathlib.Path(path).name: raise SystemExit('Blocked protected file: '+path)
            target=root/path; target.parent.mkdir(parents=True,exist_ok=True); target.write_text(content,encoding='utf-8')
          pkg=root/'package.json'
          if pkg.exists():
            try: json.loads(pkg.read_text(encoding='utf-8'))
            except Exception as e: raise SystemExit('package.json became invalid: '+str(e))
          subprocess.run(['git','config','user.name','Lovable Mobile AI'],check=True); subprocess.run(['git','config','user.email','actions@github.com'],check=True)
          subprocess.run(['git','add','-A'],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode==0: raise SystemExit('No actual changes were produced.')
          summary=str(proposal.get('summary') or 'AI modification applied')[:120]
          subprocess.run(['git','commit','-m','Lovable Mobile AI: '+summary],check=True); subprocess.run(['git','push'],check=True)
          print('LOVABLE_MOBILE_SUMMARY='+summary); print('LOVABLE_MOBILE_FILES='+','.join(f.get('path','') for f in changed))
          PY
