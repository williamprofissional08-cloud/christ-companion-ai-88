name: Nexora Forge AI
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Pedido de alteração
        required: true
        type: string
      model:
        description: Modelo Gemini
        required: false
        default: gemini-3.8-flash
        type: string
      target_branch:
        description: Branch que receberá a alteração
        required: true
        type: string
permissions:
  contents: write
jobs:
  modify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout projeto alvo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
      - name: Aplicar alteração com Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_PROMPT: ${{ inputs.prompt }}
          GEMINI_MODEL: ${{ inputs.model }}
        run: |
          python - <<'PY'
          import os,json,pathlib,urllib.request,urllib.error,urllib.parse,re
          root=pathlib.Path('.')
          prompt=os.environ.get('USER_PROMPT','').strip(); model=os.environ.get('GEMINI_MODEL') or 'gemini-3.8-flash'; api_key=os.environ.get('GEMINI_API_KEY','').strip()
          if not prompt: raise SystemExit('Entrada inválida: o prompt do workflow está vazio.')
          if not api_key: raise SystemExit('Credencial ausente: GEMINI_API_KEY não foi configurada nos Secrets do repositório.')
          exts={'.ts','.tsx','.js','.jsx','.mjs','.cjs','.json','.css','.scss','.sass','.less','.html','.md','.mdx','.vue','.svelte','.astro','.py','.java','.kt','.go','.rs','.rb','.php','.sql','.graphql','.yml','.yaml','.toml','.xml','.txt','.sh','.svg'}
          binary_exts={'.png','.jpg','.jpeg','.gif','.webp','.ico','.bmp','.pdf','.zip','.gz','.tar','.woff','.woff2','.ttf','.eot','.mp4','.mp3','.mov','.avi','.exe','.dll','.so','.dylib','.db','.sqlite'}
          names={'Dockerfile','Makefile','README','LICENSE'}; skip={'.git','node_modules','dist','build','.next','.cache','coverage'}; files=[]
          for p in root.rglob('*'):
            if not p.is_file() or any(x in skip for x in p.parts): continue
            if p.name.startswith('.env') and p.name!='.env.example': continue
            if p.suffix.lower() in binary_exts: continue
            if p.suffix.lower() not in exts and p.name not in names: continue
            try: data=p.read_text(encoding='utf-8',errors='replace')
            except Exception: continue
            files.append((p.as_posix(),data))
          terms=set(re.findall(r'[A-Za-zÀ-ÿ0-9_/-]{3,}',prompt.lower())); scored=[]
          for path,data in files:
            low=(path+' '+data[:12000]).lower(); score=sum(2 for t in terms if t in low)
            if pathlib.Path(path).name.lower() in {'package.json','vite.config.ts','vite.config.js','src/app.tsx','src/app.jsx','src/main.tsx','src/main.jsx'}: score+=3
            scored.append((score,path,data))
          scored.sort(key=lambda x:(-x[0],x[1])); selected=scored[:160]
          context='\n\n'.join('===== FILE: '+p+' =====\n'+d for _,p,d in selected)
          system='''You are a senior software engineer modifying an existing GitHub repository. Preserve existing functionality. Make only changes required by the user. Never modify .github/workflows, .env files, lockfiles, generated/binary files, or files outside the repository. Return ONLY valid JSON with keys summary and files. files must contain objects {path,content} where content is the COMPLETE new file content. Only include files that actually need changes. New source/test files are allowed when necessary, but use a safe relative path. Do not return diffs or snippets.'''
          user='User request:\n'+prompt+'\n\nRelevant repository files:\n'+context
          schema={'type':'OBJECT','properties':{'summary':{'type':'STRING'},'files':{'type':'ARRAY','items':{'type':'OBJECT','properties':{'path':{'type':'STRING'},'content':{'type':'STRING'}},'required':['path','content']}}},'required':['summary','files']}
          payload=json.dumps({'contents':[{'role':'user','parts':[{'text':system+'\n\n'+user}]}],'generationConfig':{'temperature':0.1,'responseMimeType':'application/json','responseSchema':schema}}).encode()
          endpoint='https://generativelanguage.googleapis.com/v1beta/models/'+urllib.parse.quote(model,safe='')+':generateContent?key='+urllib.parse.quote(api_key,safe='')
          req=urllib.request.Request(endpoint,data=payload,headers={'Content-Type':'application/json','Accept':'application/json'})
          def safe_error_text(value):
            text=re.sub(r'(key|token|secret|authorization)\s*[:=]\s*[^,\s]+',r'\1=[redacted]',str(value or ''),flags=re.I)
            return text.replace('\n',' ')[:1200]
          def parse_json_text(label, raw):
            text=raw.decode('utf-8','replace') if isinstance(raw,(bytes,bytearray)) else str(raw or '')
            if not text.strip(): raise SystemExit(label+' retornou resposta vazia.')
            try: return json.loads(text)
            except json.JSONDecodeError: raise SystemExit(label+' retornou JSON inválido.')
          try:
            with urllib.request.urlopen(req,timeout=180) as r:
              status=getattr(r,'status',200); body=r.read()
              if status<200 or status>=300: raise SystemExit('Gemini API HTTP '+str(status)+': erro ao consultar a API.')
              result=parse_json_text('Gemini API',body)
          except urllib.error.HTTPError as e:
            if e.code in (401,403): raise SystemExit('Falha de autenticação da Gemini API. Verifique GEMINI_API_KEY.')
            if e.code==404: raise SystemExit('Modelo Gemini inválido ou indisponível: '+model+'.')
            raise SystemExit('Gemini API HTTP '+str(e.code)+': erro ao consultar a API.')
          except urllib.error.URLError as e:
            raise SystemExit('Falha de rede ao consultar a Gemini API.')
          candidates=result.get('candidates') if isinstance(result,dict) else None
          if not isinstance(candidates,list) or not candidates: raise SystemExit('Gemini API retornou resposta sem candidatos.')
          parts=candidates[0].get('content',{}).get('parts',[]) if isinstance(candidates[0],dict) else []
          raw=''.join(str(part.get('text','')) for part in parts if isinstance(part,dict)).strip()
          if not raw: raise SystemExit('Gemini API retornou resposta vazia.')
          proposal=parse_json_text('Gemini API',raw)
          if not isinstance(proposal,dict): raise SystemExit('Gemini API retornou JSON inválido.')
          if not isinstance(proposal.get('summary'),str): raise SystemExit('Gemini API retornou summary inválido.')
          if not isinstance(proposal.get('files'),list): raise SystemExit('A IA não retornou arquivos para alteração.')
          if not proposal['files']: raise SystemExit('Nenhuma alteração foi proposta pela IA.')
          def safe_path(raw_path):
            try: p=pathlib.PurePosixPath(str(raw_path))
            except Exception: return None
            if p.is_absolute() or '..' in p.parts: return None
            clean=p.as_posix().lstrip('./')
            if not clean or clean.startswith('.github/') or clean.startswith('.git/') or any(part.startswith('.env') and part!='.env.example' for part in p.parts): return None
            return clean
          allowed={p for _,p,_ in selected}; changed=[]
          for f in proposal.get('files') or []:
            path=safe_path(f.get('path')) if isinstance(f,dict) else None; content=f.get('content') if isinstance(f,dict) else None
            if not path: raise SystemExit('Caminho de arquivo inseguro: '+str(f.get('path') if isinstance(f,dict) else f))
            if not isinstance(content,str): raise SystemExit('Conteúdo inválido para: '+path)
            allowed={p for _,p,_ in selected}
            existing=(root/path).exists()
            if existing and path not in allowed: raise SystemExit('Arquivo existente fora do contexto permitido: '+path)
            target=(root/path).resolve()
            if not target.is_relative_to(root.resolve()): raise SystemExit('Arquivo fora do repositório: '+path)
            target.parent.mkdir(parents=True,exist_ok=True); target.write_text(content,encoding='utf-8'); changed.append(path)
          changed=list(dict.fromkeys(changed))
          if not changed: raise SystemExit('A IA não identificou arquivos para alterar.')
          tracked_changed=os.system('git diff --quiet -- '+ ' '.join(__import__('shlex').quote(p) for p in changed)) != 0
          untracked=__import__('subprocess').check_output(['git','ls-files','--others','--exclude-standard','--',*changed],text=True).strip()
          if not tracked_changed and not untracked: raise SystemExit('Nenhuma alteração real foi produzida.')
          summary=str(proposal.get('summary') or 'Alteração aplicada')[:180]
          pathlib.Path('.lovable-mobile-changed.json').write_text(json.dumps(changed,ensure_ascii=False),encoding='utf-8')
          pathlib.Path('.lovable-mobile-summary.txt').write_text(summary,encoding='utf-8')
          print('LOVABLE_MOBILE_SUMMARY='+summary); print('LOVABLE_MOBILE_FILES='+','.join(changed))
          PY
      - name: Instalar dependências e validar o projeto
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f package.json ]; then
            if [ -f pnpm-lock.yaml ]; then
              corepack enable
              pnpm install --frozen-lockfile
              PM=(pnpm)
            elif [ -f yarn.lock ]; then
              corepack enable
              yarn install --immutable || yarn install --frozen-lockfile
              PM=(yarn)
            elif [ -f package-lock.json ]; then
              npm ci --no-audit --no-fund
              PM=(npm)
            else
              npm install --no-audit --no-fund
              PM=(npm)
            fi
            script_value(){ node -e "const s=require('./package.json').scripts||{}; process.stdout.write(s[process.argv[1]]||'')" "$1"; }
            run_script(){
              local name="$1" command
              command="$(script_value "$name")"
              if [ -n "$command" ] && [[ "$command" != *"no test specified"* ]]; then
                echo "Executando script: $name"
                CI=true "${PM[@]}" run "$name"
              else
                echo "Script $name não configurado; etapa ignorada."
              fi
            }
            run_script lint
            run_script typecheck
            run_script test
            run_script build
          else
            echo "package.json não encontrado; validação de Node não aplicável."
          fi
          if find . -type f -name '*.py' -not -path './.git/*' -print -quit | grep -q .; then
            python - <<'PY'
          import pathlib,py_compile
          for p in pathlib.Path('.').rglob('*.py'):
              if '.git' in p.parts or 'node_modules' in p.parts: continue
              py_compile.compile(str(p),doraise=True)
          print('Sintaxe Python validada.')
          PY
          fi
          git diff --check
      - name: Confirmar alteração validada
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json,pathlib,subprocess
          control=pathlib.Path('.lovable-mobile-changed.json')
          if not control.is_file(): raise SystemExit('Arquivo de controle ausente: .lovable-mobile-changed.json')
          raw=control.read_text(encoding='utf-8')
          if not raw.strip(): raise SystemExit('Arquivo de controle vazio: .lovable-mobile-changed.json')
          try: changed=json.loads(raw)
          except json.JSONDecodeError as e: raise SystemExit('Arquivo de controle inválido: JSON na linha '+str(e.lineno)+', coluna '+str(e.colno))
          if not isinstance(changed,list) or not changed or not all(isinstance(x,str) and x for x in changed): raise SystemExit('Arquivo de controle inválido: lista de arquivos ausente ou vazia.')
          subprocess.run(['git','config','user.name','Nexora Forge AI'],check=True)
          subprocess.run(['git','config','user.email','actions@github.com'],check=True)
          subprocess.run(['git','add','--',*changed],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          if subprocess.run(['git','diff','--cached','--quiet'],check=False).returncode==0: raise SystemExit('Nenhuma alteração validada para commit.')
          summary=pathlib.Path('.lovable-mobile-summary.txt').read_text().strip()[:180]
          subprocess.run(['git','commit','-m','Nexora Forge AI: '+summary],check=True)
          subprocess.run(['git','push'],check=True)
          PY
